# Pavis Configuration Example
#
# Notes:
# - This is a SOURCE configuration (user-authored).
# - All fields are optional unless stated otherwise.
# - Missing fields are completed structurally by the codec.
# - Semantic defaults are applied by the source-specific codec (e.g. YAML).
# - Runtime, relay, and core never apply defaults.

listeners:
  - name: "http"               # HTTP listener
    address: "0.0.0.0:80"
    workers: 2
    tls: null                  # Disabled

  - name: "https"              # TLS listener
    address: "0.0.0.0:443"
    workers: auto              # auto | number
    tls:
      cert_path: "/etc/pavis/certs/server.crt"
      key_path: "/etc/pavis/certs/server.key"

telemetry:
  level: "info"
  pingora: "info"
  service_name: "pavis"
  metrics: "0.0.0.0:9090"      # omit or null to disable
  access_log: "stdout"         # stdout | false | "/var/log/pavis/access.log"

  tracing:
    provider: "otlp"
    sampling: 1000

upstreams:
  - name: "backend"            # REQUIRED
    discovery: "static"        # static | strict-dns | logical-dns
    balancer: "round-robin"    # round-robin | random | least-request
    protocol: "h1"             # h1 | h2 | h2h1

    pool:
      idle: "60s"
      connect: "5s"
      max: null                # null = unlimited

    tls:
      enabled: true
      verify_hostname: true
      verify_cert: true
      sni: "backend.local"

    endpoints:                # REQUIRED for static discovery
      - address: "127.0.0.1"
        port: 8081
        weight: 1

routes:
  - host: "api.example.com"
    paths:
      # Example 1: Forwarding with Rewrite
      - matcher: !prefix
          path: "/v1"
        rewrite:
          path: "/v2"
          host: "internal-api.local"
        destinations:
          - upstream: "backend"
            weight: 1

      # Example 2: Redirect
      - matcher: !exact
          path: "/old-docs"
        action:
          redirect:
            status: 301
            location: "https://docs.example.com"

      # Example 3: Direct Response (e.g. Maintenance or Health)
      - matcher: !exact
          path: "/healthz"
        action:
          direct:
            status: 200
            body: "OK"

  - host: "*"
    paths:
      - matcher: !prefix
          path: "/"
        timeout: "1s"
        retry:
          attempts: 2
          per_try_timeout: "250ms"
          retry_on: ["5xx", "connect_failure"]
        destinations:
          - upstream: "backend"
            weight: 1