# Pavis Configuration Example
#
# Notes:
# - This is a SOURCE configuration (user-authored).
# - All fields are optional unless stated otherwise.
# - Missing fields are completed structurally by the codec.
# - Semantic defaults are applied by the source-specific codec (e.g. YAML).
# - Runtime, relay, and core never apply defaults.

listeners:
  - name: "default"            # default listener name
    address: "0.0.0.0:8080"    # listen address
    workers: null              # null = use runtime default
    tls: null                  # null = TLS disabled

telemetry:
  level: "info"
  pingora: "info"
  service_name: "pavis"
  metrics: "0.0.0.0:9090"      # omit or null to disable
  access_log: "stdout"         # stdout | false | file path
  tracing:
    provider: "otlp"
    sampling: 1000

upstreams:
  - name: "backend"            # REQUIRED
    discovery: "static"        # static | strict-dns | logical-dns
    balancer: "round-robin"    # round-robin | random | least-request
    protocol: "h1"             # h1 | h2 | h2h1

    pool:
      idle: "60s"
      connect: "5s"
      max: null                # null = unlimited

    tls:
      enabled: true
      verify_hostname: true
      verify_cert: true
      sni: "backend.local"

    endpoints:                # REQUIRED for static discovery
      - address: "127.0.0.1"
        port: 8081
        weight: 1

routes:
  - host: "example.com"
    paths:
      - matcher: !prefix
          path: "/"

        timeout: "1s"

        retry:
          attempts: 2
          per_try_timeout: "250ms"
          retry_on:
            - "5xx"
            - "connect_failure"

        request_headers:
          set_headers:
            - ["x-added", "1"]
          remove_headers:
            - "x-remove"

        response_headers: {}

        rewrite:
          path_prefix_rewrite: "/"
          host_rewrite_literal: "example.com"

        destinations:
          - upstream: "backend"
            weight: 1