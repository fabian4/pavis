services:
  # Upstream Service V1 (Echo Server)
  backend-v1:
    image: ealen/echo-server
    environment:
      - PORT=8081
      - SERVICE_NAME=backend-v1
    ports:
      - "8081:8081"

  # Upstream Service V2 (Echo Server)
  backend-v2:
    image: ealen/echo-server
    environment:
      - PORT=8082
      - SERVICE_NAME=backend-v2
    ports:
      - "8082:8082"

  relay:
    image: ${RELAY_IMAGE:-pavis-relay:local}
    ports:
      - "${RELAY_PORT:-8083}:8080"
    volumes:
      - ${RELAY_WORK_DIR:-./relay_tmp}:/relay
    command: ["--config", "/relay/relay.yaml"]

  pavis:
    image: ${PAVIS_IMAGE:-pavis:local}
    ports:
      - "${PAVIS_PORT:-8084}:8080"
    volumes:
      - ${PAVIS_WORK_DIR:-./pavis_tmp}:/pavis
    command:
      - "--config"
      - "/pavis/config.pvs"
      - "--relay-url"
      - "${PAVIS_RELAY_URL:-http://host.docker.internal:8083}"
