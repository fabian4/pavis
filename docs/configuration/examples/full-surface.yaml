# Full Surface Area Example
# This file includes every field implemented in the Pavis configuration.

# Global Observability
telemetry:
  level: "debug" # error, warn, info, debug, trace
  pingora: "info"
  service_name: "pavis-full-example"
  metrics: "0.0.0.0:9090" # Alias: prometheus_addr
  access_log: Stdout # Stdout, Disabled, or File: "/path"
  tracing:
    provider: "otlp" # otlp, jaeger, zipkin
    sampling: 100 # 0-100
    endpoint: "http://localhost:4317"

# Global lifecycle controls
shutdown:
  enabled: true
  drain_timeout_ms: 30000

admin:
  enabled: false
  address: "127.0.0.1:9901"

# Feature flags and limits
features:
  routing:
    advanced_matchers: false
    regex_limits:
      pattern_max_bytes: 256
      size_limit_bytes: 10485760
      input_max_bytes: 4096
      max_regex_per_route: 10
      max_regex_per_config: 100

# Inbound entry points
listeners:
  - name: "http"
    address: "0.0.0.0:80"
    workers: 8 # Optional, defaults to CPU cores
  - name: "https"
    address: "0.0.0.0:443"
    tls:
      cert_path: "/etc/pavis/server.crt"
      key_path: "/etc/pavis/server.key"
      client_auth:
        required: # required, optional, or disabled
          ca_path: "/etc/pavis/ca.crt"

# Backend clusters
upstreams:
  - name: "backend-cluster-1"
    id: 100 # Optional
    discovery: "static" # static, logical, or strict
    balancer: "round-robin" # round-robin, random, least-request
    protocol: "h2" # h1, h2, h2h1
    pool:
      idle: "1m" # humantime format
      connect: "10s"
      max: 500 # Optional, defaults to 128 (no unlimited pools)
      queue_capacity: 10 # Max requests to queue when pool is full
      queue_timeout_ms: 1000 # Queue wait timeout in milliseconds
    tls:
      enabled: true
      verify_cert: true
      verify_hostname: true
      sni_mode: "auto" # auto, name, disabled
      # ca_bundle_path: "/etc/ca.crt" # Ignored by Rustls backend
      cert:
        cert_path: "/etc/client.crt"
        key_path: "/etc/client.key"
        chain_mode: "file" # none, embedded, file
        chain_path: "/etc/client-chain.crt"
    endpoints:
      - address: "10.0.0.1"
        port: 8080
        weight: 10
      - ip: "10.0.0.2" # Alias: address
        port: 8080
        weight: 20
    
    circuit_breaker:
      max_connections: 1000
      max_pending_requests: 1000
    outlier_detection:
      consecutive_errors: 5
      eject_duration: "30s"
    health_check:
      path: "/health"
      interval: "10s"
      timeout: "2s"
      healthy_threshold: 1
      unhealthy_threshold: 1

# Virtual hosts and routing
routes:
  - host: "app.example.com"
    paths:
      - matcher:
          path: !prefix { path: "/api" }
          method: "GET" # Single method filter (optional)
          # OR use methods for multi-method matching:
          # methods: ["GET", "POST", "HEAD"]
          headers: # All header predicates must match (AND logic)
            - operator: exact
              name: "x-tenant"
              value: "prod"
            - operator: prefix
              name: "x-region"
              prefix: "us-"
            - operator: present
              name: "x-debug"
        timeout: "30s"
        retry:
          max_attempts: 3 # Range: 1-10
          retryable_reasons:
            - status_code
            - connect_timeout
            - read_timeout
            - per_try_timeout
            - pool_full
            - connect_error
          retryable_status_codes: [502, 503, 504] # Required when status_code in reasons
          backoff:
            strategy: exponential # fixed, linear, or exponential
            base_ms: 100
            max_ms: 5000
          retry_non_idempotent: false # Allow retrying POST/PATCH/DELETE
          fail_on_non_replayable_retry: false # Return 500 if body can't be buffered
          max_request_body_buffer_bytes: 1048576 # 1 MB buffer for retry replay
          per_try: "5s" # Per-attempt timeout
        request_headers:
          set_headers: [["X-Internal", "true"]]
          remove_headers: ["Authorization"]
        response_headers:
          add_headers: [["X-Pavis", "true"]]
        rewrite:
          path: "/v2/api"
          host: "internal.v2.local"
        principal:
          authenticated:
            spiffe: "spiffe://example.org/ns/foo/sa/bar"
        destinations:
          - upstream: "backend-cluster-1"
            weight: 1
      
      - matcher:
          path: !exact { path: "/ping" }
        status: 200
        body: "pong"

  - host: "legacy.example.com"
    paths:
      - matcher:
          path: !prefix { path: "/" }
        status: 301
        location: "https://app.example.com"
