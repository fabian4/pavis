routes:
  - host: "api.example.com"
    paths:
      - matcher:
          path: !prefix { path: "/v1" }
        rewrite:
          path: "/"
        request_headers:
          set_headers:
            - ["X-API-Version", "1.0"]
        destinations:
          - upstream: "api-v1"
            weight: 1
      - matcher:
          path: !exact { path: "/health" }
        status: 200
        body: "Healthy"
      - matcher:
          path: !regex { path: "^/v[0-9]/legacy" }
        status: 302
        location: "/v1/new-api"

upstreams:
  - name: "api-v1"
    endpoints:
      - address: "10.0.0.1"
        port: 80
