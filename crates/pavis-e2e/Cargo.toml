[package]
name = "pavis-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
pavis-codec-api = { path = "../pavis-codec-api" }
pavis-codec-serde = { path = "../pavis-codec-serde" }
pavis-core = { path = "../pavis-core" }
pavis = { path = "../pavis" }
pavis-ingest-api = { path = "../pavis-ingest-api" }
pavis-pvs = { path = "../pavis-pvs" }
bytes = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
