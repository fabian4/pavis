server:
  listen_addr: "0.0.0.0:8080"
  worker_threads: 2
  tls:
    enabled: false

telemetry:
  level: "info"
  pingora: "info"
  service_name: "pavis-e2e-basic-routing"
  prometheus_addr: "0.0.0.0:9091"
  access_log: "stdout"
  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 1.0

upstreams:
  - name: "backend-v1"
    load_balancer: "round-robin"
    endpoints:
      - ip: "${BACKEND_V1_HOST}"
        port: 8081
        weight: 1

  - name: "backend-v2"
    load_balancer: "round-robin"
    endpoints:
      - ip: "${BACKEND_V2_HOST}"
        port: 8082
        weight: 1

routes:
  - host: "*" 
    paths:
      - match_type: "prefix"
        path: "/"
        request_headers:
          add:
            x-sidecar-proxy: "pavis-e2e-basic"
            x-e2e-test: "true"
        destinations:
          - upstream: "backend-v1"
            weight: 50
          - upstream: "backend-v2"
            weight: 50
