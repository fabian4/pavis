server:
  listen_addr: "0.0.0.0:8080"
  worker_threads: 2
  tls:
    enabled: false

telemetry:
  level: "info"
  pingora: "info"
  service_name: "pavis-e2e-round-robin"
  prometheus_addr: "0.0.0.0:9091"
  access_log: "stdout"
  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 1.0

upstreams:
  - name: "backend-mixed"
    load_balancer: "round-robin"
    endpoints:
      - ip: "${BACKEND_V1_HOST}"
        port: 8081
      - ip: "${BACKEND_V2_HOST}"
        port: 8082

routes:
  - host: "*" 
    paths:
      - match_type: "prefix"
        path: "/round-robin"
        destinations:
          - upstream: "backend-mixed"
            weight: 100
