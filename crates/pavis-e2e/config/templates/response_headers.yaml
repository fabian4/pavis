server:
  listen_addr: "0.0.0.0:8080"
  worker_threads: 2
  tls:
    enabled: false

telemetry:
  level: "info"
  pingora: "warn"
  service_name: "pavis-e2e-response-headers"

upstreams:
  - name: "echo-backend"
    endpoints:
      - ip: "${BACKEND_V1_HOST}"
        port: 8081

routes:
  - host: "response-headers"
    paths:
      - match_type: "prefix"
        path: "/headers"
        response_headers:
          add:
            x-pavis-resp-added: "Verified"
            x-multi-word-resp: "Hello World"
            x-proxy-by: "Pavis"
          remove:
            - "Server"
        destinations:
          - upstream: "echo-backend"
            weight: 100