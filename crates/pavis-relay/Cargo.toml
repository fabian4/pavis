[package]
name = "pavis-relay"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Relay layer for Pavis"

[dependencies]
anyhow = { workspace = true }
thiserror = "1"
axum = "0.7"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
serde_yaml = "0.9"
pavis-pvs = { path = "../pavis-pvs" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
pavis-core = { path = "../pavis-core" }
rkyv = { version = "0.7", features = ["validation"] }
