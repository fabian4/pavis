listeners:
  - name: "default"
    address: "0.0.0.0:8080"
    # workers: 4
    # tls:
    #   cert_path: "/path/to/cert.pem"
    #   key_path: "/path/to/key.pem"
    #   client_auth:
    #     required:
    #       ca_path: "/path/to/ca.pem"

telemetry:
  level: "debug"
  pingora: "warn"
  service_name: "pavis-proxy"
  metrics: "0.0.0.0:9090"
  access_log: Stdout
  # tracing:
  #   provider: "otlp"
  #   sampling: 100
  #   endpoint: "http://localhost:4317"

shutdown:
  enabled: true
  drain_timeout_ms: 30000

admin:
  enabled: false
  address: "127.0.0.1:9901"

features:
  routing:
    advanced_matchers: false
    regex_limits: {}

upstreams:
  - name: "backend-v1"
    balancer: "round-robin" # Options: round-robin, random, least-request
    protocol: "h1" # Options: h1, h2, h2h1
    pool:
      idle: "60s" # Default: 60s
      connect: "5s" # Default: 5s
      # max: 128
      queue_capacity: 0
      queue_timeout_ms: 0
    # tls:
    #   enabled: true
    #   verify_cert: true
    #   verify_hostname: true
    #   sni_mode: auto
    #   # sni: "backend.example.com"
    #   # ca_bundle_path: "/etc/pavis/certs/upstream-ca.pem" # Ignored by Rustls backend
    #   # cert:
    #   #   cert_path: "/etc/pavis/certs/client.crt"
    #   #   key_path: "/etc/pavis/certs/client.key"
    #   #   chain_mode: "none" # none | embedded | file
    #   #   chain_path: "/etc/pavis/certs/client-chain.pem"
    # circuit_breaker:
    #   max_connections: 1024
    #   max_pending_requests: 500
    # outlier_detection:
    #   consecutive_errors: 5
    #   eject_duration: "30s"
    # health_check:
    #   path: "/healthz"
    #   interval: "5s"
    #   timeout: "1s"
    #   healthy_threshold: 1
    #   unhealthy_threshold: 1
    endpoints:
      - address: "127.0.0.1"
        port: 8081
        weight: 1

  - name: "backend-v2"
    balancer: "random"
    protocol: "h2"
    endpoints:
      - address: "127.0.0.1"
        port: 8082
        weight: 1

routes:
  - host: "backend"
    paths:
      - matcher:
          path: !prefix { path: "/api/v1" }
        # timeout: "2s"
        # retry:
        #   max_attempts: 3
        #   retryable_reasons: ["status_code", "connect_error"]
        #   retryable_status_codes: [502, 503, 504]
        #   per_try: "500ms"
        request_headers:
          add_headers:
            - ["x-sidecar-proxy", "pavis"]
          remove_headers:
            - "x-internal-token"
        response_headers:
          add_headers:
            - ["x-served-by", "pavis"]
        destinations:
          - upstream: "backend-v1"
            weight: 100

      - matcher:
          path: !prefix { path: "/api/v2" }
        destinations:
          - upstream: "backend-v2"
            weight: 100
