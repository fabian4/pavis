[package]
name = "pavis-benchkit"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[features]
metrics = []

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
hyper = { version = "0.14", features = ["server", "http1", "tcp", "client"] }
http = "0.2"
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[[bin]]
name = "bench-upstream"
path = "src/bin/bench-upstream.rs"

[[bin]]
name = "bench-loadgen"
path = "src/bin/bench-loadgen.rs"
