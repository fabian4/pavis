server:
  listen_addr: "0.0.0.0:8080"
  # worker_threads: 4
  # tls:
  #   enabled: false

telemetry:
  level: "debug"
  pingora: "warn"
  # access_log: "stdout"  # Options: stdout (default), false, or file path
  # service_name: "payment-service"
  # tracing:
  #   enabled: true
  #   provider: "opentelemetry"
  #   sampling_rate: 1.0

upstreams:
  - name: "backend-v1"
    # load_balancer: "round-robin"
    # http_version: "h1"  # Options: h1, h2, h2h1 (default: h1)
    # connection_pool:
    #   idle_timeout_secs: 60      # Keep connections alive for 60s (default)
    #   connection_timeout_secs: 5  # Connection timeout (default: 5s)
    # circuit_breaker:
    #   max_connections: 1024
    #   max_pending_requests: 500
    #   max_retries: 3
    # health_check:
    #   path: "/healthz"
    #   interval: "5s"
    #   timeout: "1s"
    #   unhealthy_threshold: 3
    #   healthy_threshold: 1
    endpoints:
      - ip: "127.0.0.1"
        port: 8081
        # weight: 1

  - name: "backend-v2"
    # load_balancer: "round-robin"
    # http_version: "h2"  # Use HTTP/2 for this upstream
    endpoints:
      - ip: "127.0.0.1"
        port: 8082

routes:
  - host: "backend"
    paths:
      - match_type: "prefix"
        path: "/api/v1"
        # timeout_ms: 2000
        # retry:
        #   attempts: 3
        #   retry_on: [500, 502, 503, "gateway_error", "connect_failure"]
        #   per_try_timeout_ms: 500
        request_headers:
          add:
            x-sidecar-proxy: "pavis"
          remove:
            - "x-internal-token"
        destinations:
          - upstream: "backend-v1"
            weight: 100

      - match_type: "prefix"
        path: "/api/v2"
        destinations:
          - upstream: "backend-v2"
            weight: 100