server:
  listen_addr: "0.0.0.0:8080"
telemetry:
  access_log: false
upstreams:
  - name: "backend-secure"
    type: "static"
    tls:
      enabled: true
      verify_hostname: false
      verify_cert: false
      sni: "secure.internal"
    endpoints:
      - ip: "10.0.0.1"
        port: 443
routes: []
