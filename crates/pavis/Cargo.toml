[package]
name = "pavis"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Pavis runtime"

[dependencies]
pingora = { version = "0.6.0", default-features = false, features = ["proxy", "rustls"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.2"
http = "1.4.0"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
arc-swap = "1.7.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
pavis-core = { path = "../pavis-core" }
pavis-pvs = { path = "../pavis-pvs" }
hickory-resolver = "0.25.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.1"
webpki-roots = "1"
x509-parser = "0.16"
ouroboros = "0.18"
static_assertions = "1.1"
compact_str = "0.9"
tikv-jemallocator = "0.6"

# Observability (Phase 5)
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.32"
futures-util = "0.3"

[dev-dependencies]
pavis-core = { path = "../pavis-core" }
pavis-pvs = { path = "../pavis-pvs" }
axum = { version = "0.8", features = ["macros"] }
rcgen = "0.13" # Pure-Rust replacement for OpenSSL cert generation
tempfile = "3.24.0"
