[package]
name = "pavis"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Pavis runtime"

[dependencies]
pingora = { version = "0.8.0", default-features = false, features = ["proxy", "openssl"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.2"
http = "1.4.0"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
arc-swap = "1.7.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
openssl = "0.10"
pavis-core = { path = "../pavis-core" }
pavis-pvs = { path = "../pavis-pvs" }
hickory-resolver = "0.25.2"
x509-parser = "0.16"
compact_str = "0.9"
tikv-jemallocator = "0.6"
tempfile = "3.24.0"

# Observability (Phase 5)
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.32"
futures-util = "0.3"

[dev-dependencies]
pavis-core = { path = "../pavis-core" }
pavis-pvs = { path = "../pavis-pvs" }
axum = { version = "0.8", features = ["macros"] }
rcgen = "0.14"
