[package]
name = "pavctl"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Pavis CLI"

[[bin]]
name = "pavctl"
path = "src/main.rs"

[dependencies]
pavis-core = { path = "../pavis-core" }
pavis-codec-yaml = { path = "../pavis-codec-yaml" }
pavis-pvs = { path = "../pavis-pvs" }
clap = { version = "4.5", features = ["derive"] }
serde_yaml = "0.9"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = "0.4.3"
