server:
  listen_addr: "0.0.0.0:9090"
telemetry: {}
upstreams:
  - name: "primary"
    load_balancer: "round-robin"
    http_version: "h2"
    endpoints:
      - ip: "10.0.0.1"
        port: 9000
        weight: 2
      - ip: "10.0.0.2"
        port: 9000
        weight: 1
  - name: "secondary"
    load_balancer: "random"
    http_version: "h1"
    endpoints:
      - ip: "10.0.0.3"
        port: 9001
        weight: 1
routes:
  - host: "*"
    paths:
      - match_type: "exact"
        path: "/health"
        destinations:
          - upstream: "secondary"
            weight: 1
  - host: "api.example.com"
    paths:
      - match_type: "prefix"
        path: "/v1"
        destinations:
          - upstream: "primary"
            weight: 3
