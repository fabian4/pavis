[package]
name = "pavis-cli"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Pavis CLI"

[dependencies]
pavis-core = { path = "../pavis-core" }
pavis-adapter-yaml = { path = "../pavis-adapter-yaml" }
clap = { version = "4.5", features = ["derive"] }
serde_yaml = "0.9"
anyhow = { workspace = true }
rkyv = { version = "0.7", features = ["validation"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }