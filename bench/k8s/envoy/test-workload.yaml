apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: bench-system
data:
  envoy.yaml: |
    node:
      id: envoy-sidecar
      cluster: test-cluster

    dynamic_resources:
      lds_config:
        resource_api_version: V3
        api_config_source:
          api_type: GRPC
          transport_api_version: V3
          grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster
      cds_config:
        resource_api_version: V3
        api_config_source:
          api_type: GRPC
          transport_api_version: V3
          grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster

    static_resources:
      clusters:
      - name: xds_cluster
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: envoy-xds
                    port_value: 18000
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-test-backend
  namespace: bench-system
  labels:
    app: envoy-test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-test-backend
  template:
    metadata:
      labels:
        app: envoy-test-backend
    spec:
      containers:
      # Upstream backend container
      - name: upstream
        image: pavis-bench-upstream:local
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: PORT
          value: "8081"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "1000m"

      # Envoy sidecar proxy
      - name: envoy-sidecar
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - name: proxy
          containerPort: 8080
          protocol: TCP
        - name: admin
          containerPort: 9901
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        command:
        - /usr/local/bin/envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --log-level
        - info
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /ready
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: admin
          initialDelaySeconds: 3
          periodSeconds: 5

      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-test-backend
  namespace: bench-system
  labels:
    app: envoy-test-backend
spec:
  type: ClusterIP
  ports:
  - name: proxy
    port: 8080
    targetPort: proxy
    protocol: TCP
  selector:
    app: envoy-test-backend
