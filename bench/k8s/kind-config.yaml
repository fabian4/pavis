kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Port forward for accessing services from host
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    protocol: TCP
- role: worker
  extraMounts:
  # Mount for container runtime stats access
  - hostPath: /var/lib/kubelet
    containerPath: /var/lib/kubelet
    readOnly: true
