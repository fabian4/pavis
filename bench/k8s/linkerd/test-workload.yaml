apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkerd-test-backend
  namespace: bench-system
  labels:
    app: linkerd-test-backend
  annotations:
    # Linkerd automatic injection annotation
    linkerd.io/inject: enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkerd-test-backend
  template:
    metadata:
      labels:
        app: linkerd-test-backend
      annotations:
        # Ensure linkerd proxy injection
        linkerd.io/inject: enabled
    spec:
      containers:
      # Upstream backend container
      - name: upstream
        image: pavis-bench-upstream:local
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: BENCH_UPSTREAM_BIND
          value: "0.0.0.0:8081"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: linkerd-test-backend
  namespace: bench-system
  labels:
    app: linkerd-test-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: http
    protocol: TCP
  selector:
    app: linkerd-test-backend
