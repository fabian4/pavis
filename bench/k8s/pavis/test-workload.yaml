apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-backend
  namespace: bench-system
  labels:
    app: test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-backend
  template:
    metadata:
      labels:
        app: test-backend
    spec:
      initContainers:
      # Init container to wait for relay and fetch initial config
      - name: fetch-config
        image: curlimages/curl:latest
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for pavis-relay to be ready..."
            until curl -sf http://pavis-relay.bench-system.svc.cluster.local:8090/health; do
              echo "Relay not ready, sleeping..."
              sleep 2
            done
            echo "Fetching initial config from relay..."
            curl -sf -H "X-Pavis-Version: 0" \
              http://pavis-relay.bench-system.svc.cluster.local:8090/v1/config \
              -o /config/bootstrap.pvs || echo "Failed to fetch config, continuing..."
        volumeMounts:
          - name: config-storage
            mountPath: /config
      containers:
      # Upstream backend container
      - name: upstream
        image: pavis-bench-upstream:local
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: BENCH_UPSTREAM_BIND
          value: "127.0.0.1:8081"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "1000m"

      # Pavis sidecar proxy
      - name: pavis-sidecar
        image: pavis:local
        imagePullPolicy: Never
        command: ["pavis"]
        args:
          - "--config"
          - "/config/bootstrap.pvs"
          - "--relay-url"
          - "http://pavis-relay.bench-system.svc.cluster.local:8090/v1/config"
        ports:
        - name: proxy
          containerPort: 8080
          protocol: TCP
        env:
        - name: PAVIS_RELAY_URL
          value: "http://pavis-relay.bench-system.svc.cluster.local:8090/v1/config"
        - name: PAVIS_UPSTREAM
          value: "127.0.0.1:8081"
        - name: PAVIS_BIND
          value: "0.0.0.0:8080"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: proxy
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: proxy
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
          - name: config-storage
            mountPath: /config
      volumes:
        - name: config-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: test-backend
  namespace: bench-system
  labels:
    app: test-backend
spec:
  type: ClusterIP
  ports:
  - name: proxy
    port: 8080
    targetPort: proxy
    protocol: TCP
  selector:
    app: test-backend
