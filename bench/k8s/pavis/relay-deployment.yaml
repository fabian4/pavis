apiVersion: apps/v1
kind: Deployment
metadata:
  name: pavis-relay
  namespace: bench-system
  labels:
    app: pavis-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pavis-relay
  template:
    metadata:
      labels:
        app: pavis-relay
    spec:
      containers:
      - name: relay
        image: pavis-relay:local
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        env:
        - name: PAVIS_RELAY_BIND
          value: "0.0.0.0:8090"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
