listeners:
  - name: "benchmark"
    address: "0.0.0.0:8080"
    workers: 2

telemetry:
  level: "warn"
  pingora: "error"
  service_name: "pavis-benchmark"
  access_log: false

upstreams:
  - name: "backend"
    discovery: "logical"
    balancer: "round-robin"
    protocol: "h1"
    endpoints:
      - address: "127.0.0.1"
        port: 8081

routes:
  - host: "*"
    paths:
      - matcher: !exact
          path: "/health"
        status: 200
        body: "OK"
      - matcher: !prefix
          path: "/"
        destinations:
          - upstream: "backend"
            weight: 100
