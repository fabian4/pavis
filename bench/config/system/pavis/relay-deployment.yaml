apiVersion: apps/v1
kind: Deployment
metadata:
  name: pavis-relay
  namespace: bench-system
  labels:
    app: pavis-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pavis-relay
  template:
    metadata:
      labels:
        app: pavis-relay
    spec:
      containers:
      - name: relay
        image: pavis-relay:local
        imagePullPolicy: Never
        command: ["pavis-relay"]
        args: ["--config", "/etc/pavis/relay.yaml"]
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        env:
        - name: PAVIS_RELAY_BIND
          value: "0.0.0.0:8090"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
        - name: relay-config
          mountPath: /etc/pavis
          readOnly: true
        - name: relay-storage
          mountPath: /var/lib/pavis
      volumes:
      - name: relay-config
        configMap:
          name: pavis-relay-config
      - name: relay-storage
        emptyDir: {}
