listeners:
  - name: "benchmark"
    address: "0.0.0.0:8080"
    workers: 4

telemetry:
  level: "warn"
  pingora: "error"
  access_log: "off"

upstreams:
  - name: "backend"
    discovery: "logical"
    balancer: "round-robin"
    protocol: "h1"
    endpoints:
      - address: "backend"
        port: 80

routes:
  - host: "*"
    paths:
      - matcher: !prefix
          path: "/"
        destinations:
          - upstream: "backend"
            weight: 100