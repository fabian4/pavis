name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Check Format & Lint
        run: |
          make fmt-check
          make lint

      - name: Run Unit Tests
        run: make test

      - name: Run Integration Tests
        run: make test-integration

      - name: Run CLI Tests
        run: make test-cli

      - name: Build Release Binary
        run: make binary-build

      - name: Log Binary Size
        run: |
          echo "Binary Size: $(du -h target/release/pavis | cut -f1)"

      - name: Run E2E Tests in Binary
        run: make e2e-binary

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: make docker-build-ci

      - name: Log Image Size
        run: |
          echo "Final Image Size: $(docker images --format '{{.Size}}' pavis:ci)"

      - name: Run E2E Tests in Docker
        run: make e2e-docker