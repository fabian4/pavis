name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [pavis, relay, integrated]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Format & Lint
        run: |
          make fmt-check
          make lint

      - name: Run Unit Tests
        run: make test

      - name: Build Release Binary
        run: make binary-build CRATE=workspace

      - name: Log Binary Sizes
        run: |
          echo "Pavis Binary Size: $(du -h target/release/pavis | cut -f1)"
          echo "Pavctl Binary Size: $(du -h target/release/pavctl | cut -f1)"
          echo "Pavis-Relay Binary Size: $(du -h target/release/pavis-relay | cut -f1)"

      - name: Run E2E Tests for ${matrix.image} in Binary
        run: make e2e-${{ matrix.image }}-binary

      - name: Upload Pavis Build Artifact
        uses: actions/upload-artifact@v2
        with:
          name: pavis-build-artifact
          path: target/release/pavis

      - name: Upload Pavctl Artifact
        uses: actions/upload-artifact@v2
        with:
          name: pavctl-build-artifact
          path: target/release/pavctl

      - name: Upload Pavis-Relay Artifact
        uses: actions/upload-artifact@v2
        with:
          name: pavis-relay-build-artifact
          path: target/release/pavis-relay

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [pavis, relay, integrated]
    steps:
      - uses: actions/checkout@v4

      - name: Download Pavctl Artifact
        if: matrix.image == 'pavctl'
        uses: actions/download-artifact@v2
        with:
          name: pavctl-build-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${matrix.image} Docker Image
        run: make docker-build IMAGE=${{ matrix.image }} MODE=ci

      - name: Run E2E Tests for ${matrix.image} in Docker
        run: make e2e-${{ matrix.image }}-docker