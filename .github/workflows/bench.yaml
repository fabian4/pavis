name: Bench

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk, jq, and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk jq bc

      - name: Build Pavis Docker Image
        run: make docker-build IMAGE=pavis MODE=ci

      - name: Build Bench Upstream Docker Image
        run: make docker-build IMAGE=bench-upstream MODE=ci

      - name: Build bench-loadgen
        run: cargo build -p pavis-benchkit --bin bench-loadgen --release

      - name: Benchmark Pavis (CI - short cases only)
        run: PROXY=pavis CASE="throughput_short_1x latency_short_1x concurrency_short_1x churn_short_1x reload_short_1x" make bench

      - name: Benchmark Envoy (CI - short cases only)
        run: PROXY=envoy CASE="throughput_short_1x latency_short_1x concurrency_short_1x churn_short_1x reload_short_1x" make bench

#      - name: Benchmark Nginx (CI - short cases only)
#        run: PROXY=nginx CASE="throughput_short_1x latency_short_1x concurrency_short_1x churn_short_1x reload_short_1x" make bench
#
#      - name: Benchmark HAProxy (CI - short cases only)
#        run: PROXY=haproxy CASE="throughput_short_1x latency_short_1x concurrency_short_1x churn_short_1x reload_short_1x" make bench

      - name: Generate Summary CSV
        if: always()
        run: bash bench/summarize.sh

      - name: Display Summary
        if: always()
        run: |
          echo "=== Benchmark Summary ==="
          cat bench/output/summary.csv

      - name: Debug on failure
        if: failure()
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== HAProxy Logs ==="
          docker logs bench-haproxy 2>&1 || true
          echo "=== Envoy Logs ==="
          docker logs bench-envoy 2>&1 || true
          echo "=== Nginx Logs ==="
          docker logs bench-nginx 2>&1 || true
          echo "=== Pavis Logs ==="
          docker logs bench-pavis 2>&1 || true
          echo "=== Backend Logs ==="
          docker logs bench-backend 2>&1 || true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ env.PAVIS_TAG }}-${{ env.PAVIS_COMMIT_SHORT }}
          path: bench/output/
          retention-days: 30

      - name: Cleanup
        if: always()
        working-directory: bench
        run: docker compose down -v
