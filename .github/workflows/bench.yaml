name: Benchmark Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine
  BENCH_VERBOSE: 0
  LOADGEN_WARN: 0

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk, jq, bc, kind, and kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk jq bc

          # Install kubectl
          K8S_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt | tr -d '[:space:]')
          curl -LO "https://dl.k8s.io/release/${K8S_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

          # Install kind
          KIND_VERSION="v0.20.0"
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Build benchmark tools
        run: make bench-all-build MODE=ci

      - name: Standalone Mode Benchmarks
        id: bench_standalone
        run: MODE=standalone PROXY=pavis BENCH_PROFILE=github make bench-standalone
        continue-on-error: true

      - name: Debug standalone failure
        if: always() && steps.bench_standalone.outcome == 'failure'
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          echo "--- pavis ---"
          docker logs bench-pavis 2>&1 || true
          echo "--- envoy ---"
          docker logs bench-envoy 2>&1 || true
          echo "--- nginx ---"
          docker logs bench-nginx 2>&1 || true
          echo "--- haproxy ---"
          docker logs bench-haproxy 2>&1 || true
          echo "=== Backend Logs ==="
          docker logs bench-upstream 2>&1 || true

      - name: Cleanup standalone
        if: always()
        working-directory: bench
        run: docker compose down -v

      - name: System Mode Benchmarks
        id: bench_system
        run: MODE=system PROXY=pavis BENCH_PROFILE=github make bench-system

      - name: Debug system failure
        if: always() && steps.bench_system.outcome == 'failure'
        run: |
          echo "=== Kind Cluster Info ==="
          kind get clusters || true
          kubectl get nodes -o wide || true
          kubectl get pods -n bench-system -o wide || true

          echo "=== Pod Descriptions ==="
          kubectl describe pods -n bench-system || true

          echo "=== ConfigMaps ==="
          kubectl get configmap -n bench-system pavis-relay-config -o yaml || true

          echo "=== Pod Logs ==="
          echo "--- pavis-relay logs ---"
          kubectl logs -n bench-system -l app=pavis-relay --tail=200 || true
          echo "--- test-backend pavis-sidecar logs ---"
          kubectl logs -n bench-system -l app=test-backend -c pavis-sidecar --tail=200 || true
          echo "--- test-backend upstream logs ---"
          kubectl logs -n bench-system -l app=test-backend -c upstream --tail=100 || true

          echo "=== Events ==="
          kubectl get events -n bench-system --sort-by='.lastTimestamp' || true

      - name: Cleanup system
        if: always()
        run: make bench-system-down

      - name: Append Job Summary
        run: |
          make bench-report || true
          cat bench/output/report.github.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Bench Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench/output/
          retention-days: 30
