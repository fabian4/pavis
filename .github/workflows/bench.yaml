name: Benchmark Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine
  BENCH_VERBOSE: 0
  LOADGEN_WARN: 0
  BENCH_PROFILE: github
  MODE: standalone

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk, jq, and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk jq bc

      - name: Build benchmark tools
        run: |
          cargo build -p pavis-benchkit --bin bench-loadgen --release
          cargo build -p pavctl --release

      - name: Build Pavis Docker Image
        run: make docker-build IMAGE=pavis MODE=ci

      - name: Build Upstream Docker Image
        run: make docker-build IMAGE=bench-upstream MODE=ci

      - name: Benchmark pavis
        run: PROXY="pavis" make bench

      - name: Debug on failure
        if: failure()
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          echo "--- pavis ---"
          docker logs bench-pavis 2>&1 || true
          echo "--- envoy ---"
          docker logs bench-envoy 2>&1 || true
          echo "--- nginx ---"
          docker logs bench-nginx 2>&1 || true
          echo "--- haproxy ---"
          docker logs bench-haproxy 2>&1 || true
          echo "=== Backend Logs ==="
          docker logs bench-upstream 2>&1 || true

      - name: Cleanup
        if: always()
        working-directory: bench
        run: docker compose down -v

      - name: Generate Summary and Report
        run: make bench-report

      - name: Append Job Summary
        run: cat bench/output/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bench Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench/output/
          retention-days: 30
