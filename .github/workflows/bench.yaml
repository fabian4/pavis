name: Bench

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine
  BENCH_VERBOSE: 0
  LOADGEN_WARN: 0

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk, jq, and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk jq bc

      - name: Build Pavis Docker Image
        run: make docker-build IMAGE=pavis MODE=ci

      - name: Build Bench Upstream Docker Image
        run: make docker-build IMAGE=bench-upstream MODE=ci

      - name: Build bench-loadgen
        run: cargo build -p pavis-benchkit --bin bench-loadgen --release

      - name: Benchmark proxies
        run: |
          for proxy in pavis envoy nginx haproxy; do
            echo "=== Benchmark $proxy ==="
            PROXY="$proxy" make bench
          done

      - name: Debug on failure
        if: failure()
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== Proxy Logs ==="
          for proxy in pavis envoy nginx haproxy; do
            echo "--- $proxy ---"
            docker logs bench-$proxy 2>&1 || true
          done
          echo "=== Backend Logs ==="
          docker logs bench-upstream 2>&1 || true

      - name: Cleanup
        if: always()
        working-directory: bench
        run: docker compose down -v

      - name: Generate Summary CSV
        run: bash bench/scripts/summarize.sh

      - name: Display Summary
        run: |
          echo "=== Benchmark Summary ==="
          cat bench/output/summary.csv
          echo ""
          echo "=== Pretty Table ==="
          column -t -s, bench/output/summary.csv || cat bench/output/summary.csv

      - name: Generate Key Report
        run: bash bench/scripts/report.sh

      - name: Append Key Report to Job Summary
        run: cat bench/output/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bench Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench/output/
          retention-days: 30
