name: Bench

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk bc

      - name: Build Pavis Docker Image
        run: make docker-build IMAGE=pavis MODE=ci

      - name: Build Bench Upstream Docker Image
        run: make docker-build IMAGE=bench-upstream MODE=ci

      - name: Benchmark Pavis
        working-directory: bench
        run: |
          PROXY=pavis make bench

      - name: Benchmark Envoy
        working-directory: bench
        run: |
          PROXY=enovy make bench
#
#      - name: Benchmark Nginx
#        working-directory: bench
#        run: BENCHMARK_TARGET=nginx bash scripts/run.sh
#
#      - name: Benchmark HAProxy
#        working-directory: bench
#        run: BENCHMARK_TARGET=haproxy bash scripts/run.sh

      - name: Debug on failure
        if: failure()
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== HAProxy Logs ==="
          docker logs bench-haproxy 2>&1 || true
          echo "=== Envoy Logs ==="
          docker logs bench-envoy 2>&1 || true
          echo "=== Nginx Logs ==="
          docker logs bench-nginx 2>&1 || true
          echo "=== Pavis Logs ==="
          docker logs bench-pavis 2>&1 || true
          echo "=== Backend Logs ==="
          docker logs bench-backend 2>&1 || true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ env.PAVIS_TAG }}-${{ env.PAVIS_COMMIT_SHORT }}
          path: bench/output/
          retention-days: 30

      - name: Cleanup
        if: always()
        working-directory: bench
        run: docker compose down -v
