name: Bench

on:
  workflow_dispatch:
    inputs:
      pavis_tag:
        description: "Git tag (empty for latest bench tag)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pavis tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.pavis_tag }}"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            echo "Using user-provided tag: $TAG"
          else
            echo "No tag provided, resolving latest bench-* tag..."
            TAG=$(git tag --list 'bench-*' --sort=-creatordate | head -n 1)
            if [[ -z "$TAG" ]]; then
              echo "❌ No bench-* tag found"
              exit 1
            fi
            echo "Resolved latest bench tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "PAVIS_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout resolved tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Resolve commit hash
        id: git
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_HASH=$(git rev-parse --short=12 HEAD)
      
          echo "commit=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT_HASH" >> "$GITHUB_OUTPUT"
      
          echo "PAVIS_COMMIT=$COMMIT_HASH" >> "$GITHUB_ENV"
          echo "PAVIS_COMMIT_SHORT=$SHORT_HASH" >> "$GITHUB_ENV"
      
          echo "Resolved tag ${{ inputs.pavis_tag }} -> $COMMIT_HASH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk and bc
        run: sudo apt-get update && sudo apt-get install -y wrk bc

      - name: Build Pavis Image
        run: |
          docker buildx build \
            --file crates/pavis/Dockerfile \
            --tag pavis:${PAVIS_TAG} \
            --tag pavis:${PAVIS_COMMIT_SHORT} \
            --label git.tag=${PAVIS_TAG} \
            --label git.commit=${PAVIS_COMMIT} \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --load \
            .

      - name: Benchmark Pavis
        working-directory: bench
        run: BENCHMARK_TARGET=pavis bash scripts/run.sh

      - name: Benchmark Envoy
        working-directory: bench
        run: BENCHMARK_TARGET=envoy bash scripts/run.sh

      - name: Benchmark Nginx
        working-directory: bench
        run: BENCHMARK_TARGET=nginx bash scripts/run.sh

      - name: Benchmark HAProxy
        working-directory: bench
        run: BENCHMARK_TARGET=haproxy bash scripts/run.sh

      - name: Debug on failure
        if: failure()
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== HAProxy Logs ==="
          docker logs bench-haproxy 2>&1 || true
          echo "=== Envoy Logs ==="
          docker logs bench-envoy 2>&1 || true
          echo "=== Nginx Logs ==="
          docker logs bench-nginx 2>&1 || true
          echo "=== Pavis Logs ==="
          docker logs bench-pavis 2>&1 || true
          echo "=== Backend Logs ==="
          docker logs bench-backend 2>&1 || true

      - name: Generate Summary
        run: |
          RESULTS_DIR=bench/output bash bench/scripts/csv.sh
          RESULTS_DIR=bench/output bash bench/scripts/summary.sh
          cat bench/output/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ inputs.pavis_tag }}
          path: bench/output/
          retention-days: 30

      - name: Cleanup
        if: always()
        working-directory: bench
        run: docker compose down -v