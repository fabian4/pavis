name: Bench

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ENVOY_TAG: v1.32.2
  NGINX_TAG: 1.26.2-alpine
  HAPROXY_TAG: 2.9.6-alpine
  BENCH_VERBOSE: 0
  LOADGEN_WARN: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Pavis Docker Image
        run: make docker-build IMAGE=pavis MODE=ci

      - name: Build Bench Upstream Docker Image
        run: make docker-build IMAGE=bench-upstream MODE=ci

      - name: Build bench-loadgen
        run: cargo build -p pavis-benchkit --bin bench-loadgen --release

      - name: Export Docker Images
        run: |
          mkdir -p docker-images
          docker save pavis:local -o docker-images/pavis.tar
          docker save pavis-bench-upstream:local -o docker-images/bench-upstream.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images/
          retention-days: 1

      - name: Upload bench-loadgen
        uses: actions/upload-artifact@v4
        with:
          name: bench-loadgen
          path: target/release/bench-loadgen
          retention-days: 1

  bench:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        proxy: [pavis, envoy, nginx, haproxy]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install wrk, jq, and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk jq bc

      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images/

      - name: Load Docker Images
        run: |
          docker load -i docker-images/pavis.tar
          docker load -i docker-images/bench-upstream.tar

      - name: Download bench-loadgen
        uses: actions/download-artifact@v4
        with:
          name: bench-loadgen
          path: target/release/

      - name: Make bench-loadgen executable
        run: chmod +x target/release/bench-loadgen

      - name: Benchmark ${{ matrix.proxy }}
        run: PROXY=${{ matrix.proxy }} make bench

      - name: Upload ${{ matrix.proxy }} Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output-${{ matrix.proxy }}
          path: bench/output/${{ matrix.proxy }}/
          retention-days: 1

      - name: Debug on failure
        if: failure()
        working-directory: bench
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== ${{ matrix.proxy }} Logs ==="
          docker logs bench-${{ matrix.proxy }} 2>&1 || true
          echo "=== Backend Logs ==="
          docker logs bench-upstream 2>&1 || true

      - name: Cleanup
        if: always()
        working-directory: bench
        run: docker compose down -v

  # Summary job - runs after all matrix jobs complete
  summarize:
    runs-on: ubuntu-latest
    needs: bench
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and bc
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-output-*
          path: bench-artifacts/

      - name: Restructure artifacts to expected format
        run: |
          mkdir -p bench/output
          for artifact_dir in bench-artifacts/bench-output-*; do
            if [ -d "$artifact_dir" ]; then
              proxy=$(basename "$artifact_dir" | sed 's/^bench-output-//')
              echo "Moving results for proxy: $proxy"
              mv "$artifact_dir" "bench/output/$proxy"
            fi
          done

      - name: Display downloaded artifacts
        run: |
          echo "=== Downloaded Results Structure ==="
          ls -la bench/output/
          find bench/output/ -type f -name "*.json" -o -name "*.txt" | head -20

      - name: Generate Summary CSV
        run: bash bench/scripts/summarize.sh

      - name: Display Summary
        run: |
          echo "=== Benchmark Summary ==="
          cat bench/output/summary.csv
          echo ""
          echo "=== Pretty Table ==="
          column -t -s, bench/output/summary.csv || cat bench/output/summary.csv

      - name: Generate Key Report
        run: bash bench/scripts/report.sh

      - name: Append Key Report to Job Summary
        run: cat bench/output/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Complete Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-complete
          path: |
            bench/output/
          retention-days: 30
