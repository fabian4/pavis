services:
  # Upstream Service V1 (Echo Server)
  backend-v1:
    image: ealen/echo-server:latest
    environment:
      - PORT=8081
      - SERVICE_NAME=backend-v1
      - ECHO_RESPONSE=backend-v1
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 2s
      timeout: 1s
      retries: 10

  # Upstream Service V2 (Echo Server)
  backend-v2:
    image: ealen/echo-server:latest
    environment:
      - PORT=8082
      - SERVICE_NAME=backend-v2
      - ECHO_RESPONSE=backend-v2
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 2s
      timeout: 1s
      retries: 10

  # Upstream Service TLS (OpenSSL s_server)
  backend-tls:
    image: alpine/openssl
    volumes:
      - ./certs:/certs
    command: s_server -cert /certs/upstream_tls.pem -key /certs/upstream_tls.key -accept 8443 -www -quiet
    ports:
      - "8443:8443"
