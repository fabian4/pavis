services:
  backend-v1:
    image: pavis-mock-upstream:local
    restart: unless-stopped
    environment:
      - INSTANCE_ID=backend-v1
      - HTTP_PORT=8081
      - HTTPS_PORT=8443
      - TLS_CERT_FILE=/certs/upstream_tls.pem
      - TLS_KEY_FILE=/certs/upstream_tls.key
    volumes:
      - ../../config/certs:/certs:ro
    ports:
      - "8081:8081"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 2s
      retries: 15

  backend-v2:
    image: pavis-mock-upstream:local
    restart: unless-stopped
    environment:
      - INSTANCE_ID=backend-v2
      - HTTP_PORT=8082
      - HTTPS_PORT=8444
      - TLS_CERT_FILE=/certs/upstream_tls.pem
      - TLS_KEY_FILE=/certs/upstream_tls.key
    volumes:
      - ../../config/certs:/certs:ro
    ports:
      - "8082:8082"
      - "8444:8444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/healthz"]
      interval: 3s
      timeout: 2s
      retries: 15

  pavis:
    image: pavis:local
    profiles: ["sut"]
    entrypoint: ["/usr/local/bin/pavis"]
    working_dir: /workspace
    volumes:
      - ../../..:/workspace
    environment:
      - RUST_LOG=debug
    command: ["--help"]

  relay:
    image: pavis-relay:local
    profiles: ["sut"]
    entrypoint: ["/usr/local/bin/pavis-relay"]
    working_dir: /workspace
    volumes:
      - ../../..:/workspace
    environment:
      - RUST_LOG=debug
    command: ["--help"]