[workspace]
members = [
    "crates/pavis",
    "crates/pavctl",
    "crates/pavis-pvs",
    "crates/pavis-core",
    "crates/pavis-codec-api",
    "crates/pavis-codec-serde",
    "crates/pavis-ingest-api",
    "crates/pavis-ingest-file",
    "crates/pavis-pvs",
    "crates/pavis-relay",
    "crates/pavis-testkit",
    "crates/pavis-benchkit",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive", "rc"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1.89"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
